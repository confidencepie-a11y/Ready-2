<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Wallet</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <main class="screen on" id="home">
    <div class="top">
      <div class="who"><div class="avatar" aria-hidden="true">A</div><span>Hi, AbdulQudus</span></div>
      <button class="bell" aria-label="Notifications, 1 unread">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
        <span class="dot" aria-hidden="true"></span>
      </button>
    </div>

    <section class="card" aria-label="Balance">
      <div class="acct">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8" transform="translate(-1 0)"/></svg>
        <span>7032******</span>
      </div>
      <div class="bal">
        <span id="balance"><span class="cur">$</span>0<span class="dec">.00</span></span>
        <button id="eye" aria-label="Hide balance" aria-pressed="false">
          <svg class="eye-on" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="eye-off" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 5.2A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.1 3.9M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 4.4-1.1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2M3 3l18 18"/></svg>
        </button>
      </div>
      <div class="card-actions">
        <button class="pill solid" data-sheet="Deposit" data-body="Depositing money is coming soon."><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>Deposit</button>
        <button class="pill ghost" data-sheet="Send" data-body="Sending money is coming soon."><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>Send</button>
      </div>
    </section>

    <div class="sec-head"><h2>Promotions</h2><span>4 new</span></div>
    <div class="promos" aria-label="Promotions">
      <button class="promo" data-sheet="5% cashback" data-body="Deposit for the first time and get 5% back. Details coming soon.">
        <span class="tag">New</span><span class="glyph"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12v9H4v-9M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 1 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 1 0 0-5C13 2 12 7 12 7z"/></svg></span>
        <div><div class="big">5%<small>back</small></div><h3>First deposit cashback</h3><p>Fund your wallet for the first time and get 5% back.</p></div>
      </button>
      <button class="promo p-green" data-sheet="Free transfers" data-body="Send money with no fees this month. Details coming soon.">
        <span class="tag">Limited time</span><span class="glyph"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg></span>
        <div><div class="big">$0<small>fees</small></div><h3>Free transfers</h3><p>Send to anyone in the app without paying a fee this month.</p></div>
      </button>
      <button class="promo p-amber" data-sheet="Invite a friend" data-body="Earn $20 for every friend who joins. Details coming soon.">
        <span class="tag">Bonus</span><span class="glyph"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.3-5.5 6.5-5.5s5.7 1.9 6.5 5.5M19 8v6M16 11h6"/></svg></span>
        <div><div class="big">$20<small>reward</small></div><h3>Invite a friend</h3><p>Earn $20 when a friend joins and makes their first deposit.</p></div>
      </button>
      <button class="promo p-blue" data-sheet="Virtual card" data-body="Early access to virtual cards is coming soon.">
        <span class="tag">Early access</span><span class="glyph"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 10h18M7 15h3"/></svg></span>
        <div><div class="big">Free<small>card</small></div><h3>Virtual card</h3><p>Be first to get a virtual card for safer online payments.</p></div>
      </button>
    </div>

    <h2>Transaction History</h2>
    <div id="txs"></div>
  </main>

  <main class="screen" id="cards">
    <h2 class="first">Cards</h2>
    <div class="empty-state">
      <div class="ghost-card" aria-hidden="true"><span class="chip-icon"></span><span class="ghost-num">•••• •••• •••• ••••</span></div>
      <p class="empty">No cards yet.</p>
      <button class="cta" data-sheet="Add card" data-body="Adding a card is coming soon.">Add card</button>
    </div>
  </main>

  <main class="screen" id="user"><h2 class="first">User</h2><p class="empty">Profile coming soon.</p></main>

  <nav class="nav" role="tablist" aria-label="Main">
    <button class="tab" role="tab" aria-selected="true" data-t="home">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5 2.5 10.6V21a.5.5 0 0 0 .5.5h6.2v-6.3h5.6v6.3H21a.5.5 0 0 0 .5-.5V10.6z"/></svg>Home
    </button>
    <button class="tab" role="tab" aria-selected="false" data-t="cards">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14M3 9.5h18"/><rect x="3" y="9.5" width="18" height="10" rx="1.5"/></svg>Cards
    </button>
    <button class="tab" role="tab" aria-selected="false" data-t="user">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><circle cx="12" cy="10" r="3"/><path d="M6 19c1.5-3 3.6-4 6-4s4.5 1 6 4"/></svg>User
    </button>
  </nav>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true">
    <div class="grab"></div>
    <h3 id="sheetTitle"></h3>
    <p id="sheetBody"></p>
    <button class="cta" id="sheetClose">Close</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
